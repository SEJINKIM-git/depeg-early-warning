<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">랩 개발 환경 세팅 순서</text>
  <text x="500" y="66" text-anchor="middle" font-size="14" fill="#64748b">위에서부터 순서대로 · 소요 시간 약 60~90분</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="100" width="270" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="175" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">STEP 1 · 기본 도구</text>
    <text x="175" y="154" text-anchor="middle" font-size="13" fill="#334155">Python 3.12 / Git 설치</text>
    <text x="175" y="174" text-anchor="middle" font-size="13" fill="#334155">GitHub 계정 생성</text>
  </g>

  <line x1="310" y1="145" x2="365" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="365" y="100" width="270" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">STEP 2 · 에디터</text>
    <text x="500" y="154" text-anchor="middle" font-size="13" fill="#334155">VS Code 설치</text>
    <text x="500" y="174" text-anchor="middle" font-size="13" fill="#334155">필수 확장 4종 설치</text>
  </g>

  <line x1="635" y1="145" x2="690" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="690" y="100" width="270" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="825" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">STEP 3 · 프로젝트 연결</text>
    <text x="825" y="154" text-anchor="middle" font-size="13" fill="#334155">저장소 clone</text>
    <text x="825" y="174" text-anchor="middle" font-size="13" fill="#334155">가상환경(venv) 생성</text>
  </g>

  <!-- Down connector -->
  <line x1="825" y1="190" x2="825" y2="225" stroke="#475569" stroke-width="2"/>
  <line x1="825" y1="225" x2="175" y2="225" stroke="#475569" stroke-width="2"/>
  <line x1="175" y1="225" x2="175" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g>
    <rect x="40" y="250" width="270" height="90" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="175" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">STEP 4 · AI 코딩 도구</text>
    <text x="175" y="304" text-anchor="middle" font-size="13" fill="#334155">Claude Code 또는 Codex CLI</text>
    <text x="175" y="324" text-anchor="middle" font-size="13" fill="#334155">설치 + 로그인 인증</text>
  </g>

  <line x1="310" y1="295" x2="365" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="365" y="250" width="270" height="90" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="500" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">STEP 5 · 최종 점검</text>
    <text x="500" y="304" text-anchor="middle" font-size="13" fill="#334155">검증 체크리스트 통과</text>
    <text x="500" y="324" text-anchor="middle" font-size="13" fill="#334155">(가이드 7장)</text>
  </g>

  <line x1="635" y1="295" x2="690" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="690" y="250" width="270" height="90" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="825" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#a16207">완료 · 개발 시작</text>
    <text x="825" y="304" text-anchor="middle" font-size="13" fill="#334155">첫 브랜치 생성 후</text>
    <text x="825" y="324" text-anchor="middle" font-size="13" fill="#334155">연습 PR 올리기</text>
  </g>
</svg>
