<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">협업 워크플로우 — 코드가 클라우드에 도달하는 길</text>

  <!-- Student zone -->
  <rect x="30" y="70" width="450" height="310" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="255" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">학생 영역 (로컬 + GitHub)</text>

  <!-- Leader zone -->
  <rect x="520" y="70" width="450" height="310" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="745" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">랩장 영역 (리뷰 + AWS)</text>

  <!-- Step 1 -->
  <rect x="60" y="120" width="180" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">1. 브랜치 생성</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#334155">feat/역할-작업명</text>

  <line x1="150" y1="190" x2="150" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="60" y="225" width="180" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">2. 로컬 개발</text>
  <text x="150" y="275" text-anchor="middle" font-size="12" fill="#334155">순수 함수 + mock 데이터</text>

  <line x1="240" y1="260" x2="290" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 3 -->
  <rect x="290" y="225" width="170" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="375" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">3. PR 생성</text>
  <text x="375" y="275" text-anchor="middle" font-size="12" fill="#334155">push 후 Pull Request</text>

  <line x1="375" y1="225" x2="375" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 4 CI -->
  <rect x="290" y="120" width="170" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="375" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">4. CI 자동 검사</text>
  <text x="375" y="170" text-anchor="middle" font-size="12" fill="#334155">plan 결과가 코멘트로</text>

  <line x1="460" y1="155" x2="555" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 5 review -->
  <rect x="555" y="120" width="180" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="645" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">5. 랩장 리뷰·머지</text>
  <text x="645" y="170" text-anchor="middle" font-size="12" fill="#334155">리뷰가 곧 교육 세션</text>

  <line x1="735" y1="155" x2="785" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 6 deploy -->
  <rect x="785" y="120" width="160" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="865" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">6. AWS 배포</text>
  <text x="865" y="170" text-anchor="middle" font-size="12" fill="#334155">main 머지 시 자동</text>

  <!-- Feedback arrow -->
  <line x1="645" y1="190" x2="645" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="645" y1="260" x2="465" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="645" y="285" text-anchor="middle" font-size="12" fill="#94a3b8">수정 요청 시 → 2번으로 돌아가 커밋 추가</text>

  <!-- Rules box -->
  <rect x="60" y="320" width="885" height="44" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="500" y="347" text-anchor="middle" font-size="13" fill="#713f12">규칙: main에 직접 push 금지 · 모든 코드는 PR로만 · AWS 콘솔은 랩장 전담 — 학생은 계정 없이도 전 과정 참여 가능</text>
</svg>
